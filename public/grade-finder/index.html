:root{--bg:#F6F4EF;--card:#FFFFFF;--ink:#1E2A32;--txt:#3A4650;--mut:#6B7880;--line:#E2DED6;--acc:#C0601A;--teal:#1F7A8C;--soft:#F3EFE7;--gate:#FFF6E8;
 --r:#C0392B;--o:#E67E22;--y:#C9A20C;--w:#A0A7AC}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14191D;--card:#1D252B;--ink:#EEF1F2;--txt:#C9D1D5;--mut:#8C989F;--line:#2F3A41;--soft:#232D33;--gate:#2E2A20;--teal:#4FB3C4;--acc:#E8914A}}
:root[data-theme="dark"]{--bg:#14191D;--card:#1D252B;--ink:#EEF1F2;--txt:#C9D1D5;--mut:#8C989F;--line:#2F3A41;--soft:#232D33;--gate:#2E2A20;--teal:#4FB3C4;--acc:#E8914A}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Vz,Tahoma,sans-serif;line-height:1.7;font-size:15px}
b{color:var(--ink)}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px 10px}
.wrap{max-width:1180px;margin:0 auto}
h1{font-size:20px;margin:0 0 8px;color:var(--ink)}h1 span{color:var(--acc);font-size:14px;font-weight:400;margin-right:8px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#q{flex:1 1 260px;font:inherit;font-size:16px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);outline:none}
#q:focus{border-color:var(--teal)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
